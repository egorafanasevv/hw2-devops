---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Restart PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ __pg_service_name }}"
    state: restarted
  become: true

- name: Restart PostgreSQL exporter
  ansible.builtin.systemd_service:
    name: "{{ __exporter_service }}"
    state: restarted
  become: true

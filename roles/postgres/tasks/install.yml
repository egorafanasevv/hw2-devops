---
- name: Install PostgreSQL common tools
  ansible.builtin.apt:
    name:
      - postgresql-common
      - acl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable automatic PostgreSQL cluster creation
  ansible.builtin.lineinfile:
    path: /etc/postgresql-common/createcluster.conf
    regexp: '^\s*#?\s*create_main_cluster\s*='
    line: 'create_main_cluster = false'

- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres__version }}"
      - "postgresql-client-{{ postgres__version }}"
      - python3-psycopg2
    state: present
  notify: Restart PostgreSQL

- name: Create data root directory
  ansible.builtin.file:
    path: /data
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create PostgreSQL parent directory
  ansible.builtin.file:
    path: /data/postgres
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Create PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgres__data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Initialize PostgreSQL database cluster
  ansible.builtin.command:
    cmd: "{{ __pg_bin_dir }}/pg_ctl initdb -D {{ postgres__data_dir }}"
    creates: "{{ postgres__data_dir }}/PG_VERSION"
  become_user: postgres

- name: Configure PostgreSQL parameters
  ansible.builtin.lineinfile:
    path: "{{ postgres__data_dir }}/postgresql.conf"
    regexp: '^\s*#?\s*{{ item.key | regex_escape }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
    owner: postgres
    group: postgres
    mode: "0600"
  loop: "{{ postgres__opts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart PostgreSQL

- name: Configure PostgreSQL authentication
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgres__data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart PostgreSQL

- name: Create PostgreSQL systemd unit
  ansible.builtin.template:
    src: postgres.service.j2
    dest: "/etc/systemd/system/{{ __pg_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart PostgreSQL

- name: Apply pending handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ __pg_service_name }}"
    state: started
    enabled: true

- name: Check PostgreSQL with SELECT 1
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -h
      - /var/run/postgresql
      - -U
      - postgres
      - -d
      - postgres
      - -tAc
      - SELECT 1
  become_user: postgres
  register: __pg_select_1
  changed_when: false
  until: (__pg_select_1.stdout | trim) == '1'
  retries: 5
  delay: 2
